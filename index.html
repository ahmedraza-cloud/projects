<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ahmed Raza - Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
  :root{
    --page:#F7F6F6;
    --surface:#FFFFFF;
    --ink:#1D1B1C;
    --muted:#5E5A5B;
    --faint:#8E8889;
    --line:#E8E3E3;
    --rail:#F0EAEA;
    --band:#D7191F;
    --band-deep:#A90F15;
    --band-ink:#FFFFFF;
    --band-muted:rgba(255,255,255,.78);
    --band-rail:rgba(255,255,255,.25);
    --band-accent:#FFFFFF;
    --ai:#D7191F;
    --ai-tint:#FDE8E8;
    --dt:#3B3638;
    --dt-tint:#EFEDED;
    --st-done:#1E7B46;
    --st-progress:#B26B00;
    --st-planning:#5B6B82;
    --st-pending:#A3ACB7;
    --warn:#A15C00;
    --danger:#A3261F;
    --danger-tint:#FCEDEC;
    --primary:#D7191F;
    --primary-ink:#FFFFFF;
    --focus:#D7191F;
    --overlay:rgba(29,20,20,.5);
    --shadow:0 1px 2px rgba(120,10,14,.06), 0 10px 28px rgba(120,10,14,.08);
    --sans:"DM Sans","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
    --display:"Sora","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
    --r:8px;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --page:#151213;
      --surface:#1F1B1C;
      --ink:#F1ECEC;
      --muted:#B3AAAB;
      --faint:#857C7D;
      --line:#332D2E;
      --rail:#332D2E;
      --band:#B5141A;
      --band-deep:#8A0D12;
      --ai:#FF5A5F;
      --ai-tint:rgba(255,90,95,.14);
      --dt:#D9D2D3;
      --dt-tint:rgba(217,210,211,.12);
      --st-done:#4CC27F;
      --st-progress:#E2A33B;
      --st-planning:#9AA8BC;
      --st-pending:#66717E;
      --warn:#E2A33B;
      --danger:#F08A82;
      --danger-tint:rgba(240,138,130,.12);
      --primary:#E0262C;
      --primary-ink:#FFFFFF;
      --focus:#FF5A5F;
      --overlay:rgba(0,0,0,.6);
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --page:#151213;--surface:#1F1B1C;--ink:#F1ECEC;--muted:#B3AAAB;--faint:#857C7D;--line:#332D2E;--rail:#332D2E;
    --band:#B5141A;--band-deep:#8A0D12;--ai:#FF5A5F;--ai-tint:rgba(255,90,95,.14);--dt:#D9D2D3;--dt-tint:rgba(217,210,211,.12);--focus:#FF5A5F;
    --st-done:#4CC27F;--st-progress:#E2A33B;--st-planning:#9AA8BC;--st-pending:#66717E;--warn:#E2A33B;
    --danger:#F08A82;--danger-tint:rgba(240,138,130,.12);--primary:#E0262C;--primary-ink:#FFFFFF;
    --overlay:rgba(0,0,0,.6);--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--page);color:var(--ink);font-family:var(--sans);
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums;padding-bottom:56px;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 28px}

  /* ---------- header band ---------- */
  .band{
    background:var(--band);color:var(--band-ink);padding:30px 0 80px;position:relative;overflow:hidden;
    border-top:5px solid var(--band-deep);
  }
  .band::after{
    content:"";position:absolute;right:-140px;top:-180px;width:520px;height:520px;border-radius:50%;
    border:70px solid rgba(255,255,255,.06);pointer-events:none;
  }
  .band .wrap{position:relative;z-index:1}
  .band .wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px;align-items:end}
  .org{display:flex;align-items:center;gap:14px;margin:0 0 28px}
  .org img{height:44px;width:auto;display:block}
  .org .logo-print{display:none}
  .org-name{font-family:var(--display);font-size:22px;font-weight:500;letter-spacing:.01em;padding-left:14px;border-left:1px solid rgba(255,255,255,.45);line-height:1.1}
  h1{font-family:var(--display);font-size:clamp(28px,3.8vw,42px);line-height:1.1;letter-spacing:-.03em;font-weight:600;margin:0}
  .period{font-size:16px;color:var(--band-muted);margin:10px 0 0}
  [contenteditable="true"]{outline:none;border-bottom:1px dashed rgba(255,255,255,.45);cursor:text}
  [contenteditable="true"]:focus{border-bottom-color:#fff;background:rgba(255,255,255,.08)}

  .overall{padding-left:28px;border-left:1px solid rgba(255,255,255,.3)}
  .overall-l{font-size:13.5px;color:var(--band-muted);margin:0 0 4px}
  .overall-n{font-family:var(--display);font-size:54px;font-weight:600;line-height:1;letter-spacing:-.03em}
  .overall-n span{font-size:24px;font-weight:500;color:var(--band-muted);margin-left:2px}
  .overall-rail{height:6px;border-radius:3px;background:var(--band-rail);overflow:hidden;margin:14px 0 8px}
  .overall-rail i{display:block;height:100%;background:var(--band-accent);border-radius:3px;transform-origin:left center;animation:fill .9s cubic-bezier(.2,.7,.3,1) .15s backwards}
  .overall-sub{font-size:12.5px;color:var(--band-muted)}

  /* ---------- stat strip ---------- */
  .stats{
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
    background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);
    margin:-44px 0 26px;position:relative;
  }
  .stat{padding:18px 22px 16px;display:flex;flex-direction:column;justify-content:space-between;min-height:118px}
  .stat + .stat{border-left:1px solid var(--line)}
  .stat-n{font-family:var(--display);font-size:32px;font-weight:600;letter-spacing:-.025em;line-height:1}
  .stat-n .pc{font-size:17px;color:var(--muted);margin-left:1px}
  .stat-l{font-size:13.5px;font-weight:500;color:var(--muted);margin-top:6px}
  .split{display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--rail);margin-top:14px}
  .split i{display:block;height:100%;transform-origin:left center;animation:fill .6s cubic-bezier(.2,.7,.3,1) backwards}
  .split .ai{background:var(--ai)}
  .split .dt{background:var(--dt)}
  .stat-sub{font-size:12px;color:var(--faint);margin-top:7px}

  /* ---------- toolbar ---------- */
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:28px}
  button{font-family:var(--sans);font-size:13.5px;cursor:pointer}
  .btn{background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:7px 14px;border-radius:6px;font-weight:500;transition:border-color .15s,background .15s}
  .btn:hover{border-color:var(--faint)}
  .btn:focus-visible,[contenteditable]:focus-visible,.seg-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .btn[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
  .btn--ghost{background:transparent;border-color:transparent;color:var(--muted)}
  .btn--ghost:hover{background:var(--surface);border-color:var(--line)}
  .edit-only{display:none}
  body.editing .edit-only{display:inline-flex;align-items:center;gap:6px}
  .flag{font-size:12.5px;font-weight:500;color:var(--warn);opacity:0;transition:opacity .2s}
  body.dirty .flag{opacity:1}
  .spacer{margin-left:auto}
  .segctl{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px}
  .seg-btn{border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:500;padding:5px 14px;border-radius:5px}
  .seg-btn[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}

  /* ---------- sections ---------- */
  .track{margin-bottom:34px}
  .track-head{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
  .track-mark{width:4px;height:18px;border-radius:2px;flex-shrink:0;align-self:center}
  .track--ai .track-mark{background:var(--ai)}
  .track--dt .track-mark{background:var(--dt)}
  .track-head h2{font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:-.012em;margin:0}
  .track-meta{font-size:13px;color:var(--muted);margin-left:auto}

  .rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .row{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:28px;align-items:center;
    padding:16px 22px;
  }
  .row-main{min-height:42px;display:flex;flex-direction:column;justify-content:center}
  body:not(.view-grid).editing .rows .row{grid-template-columns:minmax(0,1fr) 280px 84px}
  body.editing .rows .row{cursor:pointer}
  body.editing .rows .row:hover{border-color:var(--faint)}

  .row-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .row-name{font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:-.008em;margin:0;line-height:1.35}
  .sponsor{font-size:12px;font-weight:500;padding:2px 8px;border-radius:4px;white-space:nowrap}
  .track--ai .sponsor{background:var(--ai-tint);color:var(--ai)}
  .track--dt .sponsor{background:var(--dt-tint);color:var(--dt)}
  .note{margin:5px 0 0;font-size:14px;color:var(--muted);max-width:64ch}
  .note:empty{display:none}

  /* ---------- progress ---------- */
  .stage{min-width:0}
  .stage-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
  .stage-name{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--ink)}
  .stage-name::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--st-pending)}
  .row.st-done .stage-name::before{background:var(--st-done)}
  .row.st-progress .stage-name::before{background:var(--st-progress)}
  .row.st-planning .stage-name::before{background:var(--st-planning)}
  .stage-pct{font-size:14px;font-weight:600}
  .rail{height:6px;border-radius:3px;background:var(--rail);overflow:hidden}
  .rail i{display:block;height:100%;border-radius:3px;transform-origin:left center;animation:fill .7s cubic-bezier(.2,.7,.3,1) backwards}
  .track--ai .rail i{background:var(--ai)}
  .track--dt .rail i{background:var(--dt)}
  @keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}

  /* ---------- grid view ---------- */
  body.view-grid .rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:12px}
  body.view-grid .row{display:flex;flex-direction:column;align-items:stretch;gap:0;padding:18px 20px 16px}
  body.view-grid .track--ai .row{border-top:3px solid var(--ai)}
  body.view-grid .track--dt .row{border-top:3px solid var(--dt)}
  body.view-grid .row-main{flex:1;justify-content:flex-start;min-height:0;margin-bottom:18px}
  body.view-grid .row-head{flex-direction:column;align-items:flex-start;gap:8px}
  body.view-grid .sponsor{align-self:flex-start}
  body.view-grid .note{margin-top:10px;font-size:13.5px}
  body.view-grid .stage{padding-top:14px;border-top:1px solid var(--line)}
  body.view-grid .row-actions{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);justify-content:flex-start}
  body:not(.view-grid) .track--ai .row{box-shadow:inset 3px 0 0 var(--ai)}
  body:not(.view-grid) .track--dt .row{box-shadow:inset 3px 0 0 var(--dt)}

  .row-actions{display:none;gap:2px;justify-content:flex-end}
  body.editing .row-actions{display:flex}
  .icon{width:28px;height:28px;border:1px solid transparent;background:transparent;border-radius:6px;color:var(--faint);font-size:13px;line-height:1;display:grid;place-items:center;padding:0}
  .icon:hover{background:var(--page);color:var(--ink);border-color:var(--line)}
  .icon:focus-visible{outline:2px solid var(--focus);outline-offset:1px}

  .empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);font-size:14px}

  footer{margin-top:38px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--faint);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

  /* ---------- modal ---------- */
  .overlay{position:fixed;inset:0;background:var(--overlay);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  .overlay.open{display:flex}
  .sheet{background:var(--surface);color:var(--ink);border-radius:12px;width:100%;max-width:540px;padding:26px;box-shadow:0 24px 60px rgba(0,0,0,.28);max-height:90vh;overflow:auto}
  .sheet h2{margin:0 0 20px;font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:-.015em}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;font-family:var(--sans);font-size:14.5px;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:9px 11px;background:var(--surface)}
  .field textarea{resize:vertical;min-height:72px}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--focus);outline-offset:-1px;border-color:var(--focus)}
  .hint{font-size:12.5px;color:var(--faint);margin-top:5px}
  .trio{display:grid;grid-template-columns:1fr 1fr 108px;gap:12px}
  .sheet-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:22px}
  .btn--primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
  .btn--danger{color:var(--danger);border-color:transparent;background:transparent;margin-right:auto}
  .btn--danger:hover{background:var(--danger-tint);border-color:transparent}

  .toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translate(-50%,14px);background:var(--primary);color:var(--primary-ink);padding:10px 16px;border-radius:7px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:900px){
    .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
    .stat:nth-child(3){border-left:0}
    .stat:nth-child(n+3){border-top:1px solid var(--line)}
    .band .wrap{grid-template-columns:1fr;gap:26px}
    .overall{padding-left:0;border-left:0;padding-top:22px;border-top:1px solid rgba(255,255,255,.3)}
  }
  @media (max-width:760px){
    .wrap{padding:0 16px}
    .band{padding:26px 0 70px}
    .row,body:not(.view-grid).editing .rows .row{grid-template-columns:1fr;gap:14px}
    .row-actions{justify-content:flex-start}
    .trio{grid-template-columns:1fr}
    body.view-grid .rows{grid-template-columns:1fr}
    .track-head{flex-wrap:wrap}
    .track-meta{margin-left:16px;flex-basis:100%}
    .spacer{margin-left:0}
  }

  @media print{
    :root{--page:#fff;--surface:#fff;--ink:#1D1B1C;--muted:#5E5A5B;--line:#E0DADA;--rail:#F0EAEA;--ai:#D7191F;--dt:#3B3638;--ai-tint:#FDE8E8;--dt-tint:#EFEDED;--band:#D7191F}
    .band{border-top:0}
    .band::after{display:none}
    .org .logo-screen{display:none}
    .org .logo-print{display:block}
    .org-name{color:var(--band);border-left-color:var(--line)}
    body{background:#fff;padding:0;font-size:11.5px}
    .band{background:#fff;color:var(--ink);padding:0 0 14px;border-bottom:2px solid var(--band)}
    .org,.period,.overall-l,.overall-sub,.overall-n span{color:var(--muted)}
    .overall{border-left-color:var(--line)}
    .overall-rail{background:var(--rail)}
    .overall-rail i{background:var(--band)}
    .stats{margin:14px 0;box-shadow:none}
    .toolbar,.row-actions,.flag,footer{display:none!important}
    .row,.stat{break-inside:avoid}
    .rail i,.split i,.overall-rail i{animation:none}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

    {

      "track": "dt",
      "stage": "progress",
      "pct": 40,
      "sponsor": "Sales",
      "note": "APIs & Integration Document delivered to third party waiting for development."
    },
    {
      "name": "MPS - Phase 2 (Dispensing Phase)",
      "track": "dt",

      "pct": 10,
      "sponsor": "Planning",
      "note": "BRD Received but Excel formats and formulation not received yet. Project deadline 31-Dec-2026"
    },
    {
      "name": "CMO Dashboard - Phase 1 (Foundation)",
      "track": "dt",

      "pct": 100,
      "sponsor": "CMO",
      "note": "Project Delivered on 22-Oct-2026"
    },
    {
      "name": "CMO Dashboard - Phase 2 (Enhancements)",
      "track": "dt",

      "pct": 0,
      "sponsor": "CMO",

    {
      "name": "SAP Support and implementation of SAP Wave 1",

    }
  ]
};
/* DATA_END */

/* Captures the file exactly as it loaded, before anything renders.
   "Save file" rewrites only the data block above and downloads a fresh copy. */
const SOURCE = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;

const STAGES = [
  {id:"pending",  label:"Pending",     pct:10},
  {id:"planning", label:"Planning",    pct:30},
  {id:"progress", label:"In progress", pct:65},
  {id:"done",     label:"Completed",   pct:100}
];
const TRACKS = [
  {id:"ai", label:"AI Projects"},
  {id:"dt", label:"Digital Transformation"}
];

const $ = s => document.querySelector(s);
const board = $("#board");
let editing = false, dirty = false, current = null;

const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const stageOf = id => STAGES.find(s => s.id === id) || STAGES[0];
const pctOf = p => {
  const raw = (p.pct === null || p.pct === undefined || p.pct === "") ? stageOf(p.stage).pct : Number(p.pct);
  return Math.max(0, Math.min(100, isNaN(raw) ? 0 : Math.round(raw)));
};
function markDirty(){ dirty = true; document.body.classList.add("dirty"); }

function statBox(n, label, suffix, bars, sub, delay){
  const segs = bars.map(b => b.v > 0
    ? `<i class="${b.c}" style="width:${b.v}%;animation-delay:${delay + 120}ms"></i>` : "").join("");
  return `<div class="stat">
    <div>
      <div class="stat-n">${n}${suffix ? `<span class="pc">${suffix}</span>` : ""}</div>
      <div class="stat-l">${label}</div>
    </div>
    <div>
      <div class="split">${segs}</div>
      <div class="stat-sub">${sub}</div>
    </div>
  </div>`;
}

function renderStats(){
  const ps = BOARD.projects, total = ps.length || 1;
  const by = (f, t) => ps.filter(p => f(p) && (!t || p.track === t)).length;
  const share = (f) => [
    {c:"ai", v: by(f,"ai") / total * 100},
    {c:"dt", v: by(f,"dt") / total * 100}
  ];
  const notStarted = p => p.stage === "pending" || p.stage === "planning";
  const inProg = p => p.stage === "progress";
  const done = p => p.stage === "done";
  const avg = ps.length ? Math.round(ps.reduce((s,p) => s + pctOf(p), 0) / ps.length) : 0;
  const mix = `${by(()=>true,"ai")} AI, ${by(()=>true,"dt")} digital transformation`;

  $("#stats").innerHTML =
    statBox(ps.length, "Total projects", "", share(()=>true), mix, 0) +
    statBox(by(inProg), "In progress", "", share(inProg), pcLabel(by(inProg), ps.length), 60) +
    statBox(by(notStarted), "Not started", "", share(notStarted), pcLabel(by(notStarted), ps.length), 120) +
    statBox(by(done), "Completed", "", share(done), pcLabel(by(done), ps.length), 180);
  $("#bandPct").textContent = avg;
  $("#bandBar").style.width = avg + "%";
  $("#bandSub").textContent = `Average completion across ${ps.length} project${ps.length === 1 ? "" : "s"}`;
}
const pcLabel = (n, t) => t ? Math.round(n / t * 100) + "% of portfolio" : "—";

function render(){
  $("#heading").textContent = BOARD.heading;
  $("#period").textContent = BOARD.period;
  document.title = BOARD.heading;
  document.body.classList.toggle("view-grid", BOARD.view === "grid");
  $("#listBtn").setAttribute("aria-pressed", String(BOARD.view !== "grid"));
  $("#gridBtn").setAttribute("aria-pressed", String(BOARD.view === "grid"));
  renderStats();

  let n = 0;
  board.innerHTML = TRACKS.map(t => {
    const items = BOARD.projects.filter(p => p.track === t.id);
    const done = items.filter(p => p.stage === "done").length;
    const rows = items.length ? items.map(p => {
      const gi = BOARD.projects.indexOf(p);
      const st = stageOf(p.stage), pct = pctOf(p);
      const row = `<li class="row st-${esc(p.stage)} ${p.stage === "done" ? "done" : ""}" data-i="${gi}">
        <div class="row-main">
          <div class="row-head">
            <h3 class="row-name">${esc(p.name)}</h3>
            ${p.sponsor ? `<span class="sponsor">${esc(p.sponsor)}</span>` : ""}
          </div>
          <p class="note">${esc(p.note)}</p>
        </div>
        <div class="stage">
          <div class="stage-top">
            <span class="stage-name">${st.label}</span>
            <span class="stage-pct">${pct}%</span>
          </div>
          <div class="rail"><i style="width:${pct}%;animation-delay:${n*55 + 130}ms"></i></div>
        </div>
        <div class="row-actions">
          <button class="icon" data-act="up" data-i="${gi}" title="Move up" aria-label="Move ${esc(p.name)} up">↑</button>
          <button class="icon" data-act="down" data-i="${gi}" title="Move down" aria-label="Move ${esc(p.name)} down">↓</button>
          <button class="icon" data-act="edit" data-i="${gi}" title="Edit" aria-label="Edit ${esc(p.name)}">✎</button>
        </div>
      </li>`;
      n++;
      return row;
    }).join("") : `<li class="empty">No projects in this portfolio yet. Turn on Edit board, then add one.</li>`;

    const avg = items.length ? Math.round(items.reduce((s,p) => s + pctOf(p), 0) / items.length) : 0;
    return `<section class="track track--${t.id}">
      <div class="track-head">
        <span class="track-mark"></span>
        <h2>${t.label}</h2>
        <span class="track-meta">${items.length} project${items.length === 1 ? "" : "s"}, ${done} completed, ${avg}% average</span>
      </div>
      <ul class="rows">${rows}</ul>
    </section>`;
  }).join("");

  $("#foot-left").textContent = BOARD.projects.length + " projects across 2 portfolios";
}

/* ---------- view switcher ---------- */
function setView(v){
  if (BOARD.view === v) return;
  BOARD.view = v; markDirty(); render();
}
$("#listBtn").addEventListener("click", () => setView("list"));
$("#gridBtn").addEventListener("click", () => setView("grid"));

/* ---------- edit mode ---------- */
$("#editBtn").addEventListener("click", () => {
  editing = !editing;
  document.body.classList.toggle("editing", editing);
  $("#editBtn").setAttribute("aria-pressed", String(editing));
  $("#editBtn").textContent = editing ? "Done editing" : "Edit board";
  ["#heading", "#period"].forEach(sel => $(sel).setAttribute("contenteditable", editing ? "true" : "false"));
});

["#heading", "#period"].forEach(sel => {
  $(sel).addEventListener("input", e => {
    BOARD[sel === "#heading" ? "heading" : "period"] = e.target.textContent.trim();
    markDirty();
  });
});

board.addEventListener("click", e => {
  const btn = e.target.closest("button[data-act]");
  if (!btn){
    const row = e.target.closest(".row");
    if (editing && row) openSheet(+row.dataset.i);
    return;
  }
  const i = +btn.dataset.i, act = btn.dataset.act;
  if (act === "edit") return openSheet(i);
  const p = BOARD.projects[i];
  const sameTrack = BOARD.projects.map((x, idx) => x.track === p.track ? idx : -1).filter(idx => idx >= 0);
  const pos = sameTrack.indexOf(i);
  const swapWith = act === "up" ? sameTrack[pos - 1] : sameTrack[pos + 1];
  if (swapWith === undefined) return;
  BOARD.projects[i] = BOARD.projects[swapWith];
  BOARD.projects[swapWith] = p;
  markDirty(); render();
});

/* ---------- add / edit sheet ---------- */
function syncPctPlaceholder(){
  $("#f-pct").placeholder = stageOf($("#f-stage").value).pct + " (auto)";
}
$("#f-stage").addEventListener("change", syncPctPlaceholder);

function openSheet(i){
  current = i;
  const p = i === null
    ? {name:"", track:"ai", stage:"planning", pct:null, sponsor:"", note:""}
    : BOARD.projects[i];
  $("#sheetTitle").textContent = i === null ? "Add project" : "Edit project";
  $("#f-name").value = p.name;
  $("#f-track").value = p.track;
  $("#f-stage").value = p.stage;
  $("#f-pct").value = (p.pct === null || p.pct === undefined) ? "" : p.pct;
  $("#f-sponsor").value = p.sponsor || "";
  $("#f-note").value = p.note || "";
  syncPctPlaceholder();
  $("#deleteBtn").style.display = i === null ? "none" : "";
  $("#overlay").classList.add("open");
  setTimeout(() => $("#f-name").focus(), 30);
}
function closeSheet(){ $("#overlay").classList.remove("open"); current = null; }

$("#addBtn").addEventListener("click", () => openSheet(null));
$("#cancelBtn").addEventListener("click", closeSheet);
$("#overlay").addEventListener("mousedown", e => { if (e.target === $("#overlay")) closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

$("#okBtn").addEventListener("click", () => {
  const name = $("#f-name").value.trim();
  if (!name){ $("#f-name").focus(); toast("Give the project a name first"); return; }
  const rawPct = $("#f-pct").value.trim();
  const p = {
    name,
    track: $("#f-track").value,
    stage: $("#f-stage").value,
    pct: rawPct === "" ? null : Math.max(0, Math.min(100, Math.round(Number(rawPct)))),
    sponsor: $("#f-sponsor").value.trim(),
    note: $("#f-note").value.trim()
  };
  if (current === null) BOARD.projects.push(p); else BOARD.projects[current] = p;
  closeSheet(); markDirty(); render();
});

$("#deleteBtn").addEventListener("click", () => {
  if (current === null) return;
  BOARD.projects.splice(current, 1);
  closeSheet(); markDirty(); render();
  toast("Project removed");
});

/* ---------- save / copy / print ---------- */
function buildFile(){
  const START = "/* DATA" + "_START */", END = "/* DATA" + "_END */";
  const a = SOURCE.indexOf(START), b = SOURCE.indexOf(END);
  if (a < 0 || b < 0) return null;
  const data = JSON.stringify(BOARD, null, 2).replace(/<\//g, "<\\/");
  return SOURCE.slice(0, a) + START + "\nconst BOARD = " + data + ";\n" + SOURCE.slice(b);
}

$("#saveBtn").addEventListener("click", () => {
  const html = buildFile();
  if (!html){ toast("Could not rebuild the file — use Copy data instead"); return; }
  const slug = (BOARD.heading || "projects").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const url = URL.createObjectURL(new Blob([html], {type:"text/html"}));
  const a = document.createElement("a");
  a.href = url; a.download = slug + ".html";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  dirty = false; document.body.classList.remove("dirty");
  toast("Saved — replace your old file with the download");
});

$("#copyBtn").addEventListener("click", async () => {
  const text = JSON.stringify(BOARD, null, 2);
  try{
    await navigator.clipboard.writeText(text);
    toast("Data copied to clipboard");
  }catch(err){
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("Data copied to clipboard"); }
    catch(e2){ toast("Copy blocked here — use Save file instead"); }
    ta.remove();
  }
});

$("#printBtn").addEventListener("click", () => window.print());

let toastTimer;
function toast(msg){
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

render();
</script></body></html>
